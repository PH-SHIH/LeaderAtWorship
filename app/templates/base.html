<!DOCTYPE html>
<html lang="zh-TW">
<head>

    <title>{% block title %}LeaderAtWorship{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/main.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">
            <a href="/">LeaderAtWorship</a>
        </div>
        <div class="navbar-menu">
            <a href="/songs">歌曲庫</a>
            <a href="/flows">敬拜流程</a>
            <a href="/audio">音頻處理</a>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', path='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
